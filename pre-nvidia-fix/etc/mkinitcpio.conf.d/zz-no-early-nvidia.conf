# Keep the NVIDIA driver out of the initramfs so hibernate resume works.
# With nvidia loaded early, the boot kernel's nv_pmops_freeze returns -5 while
# handing over to the hibernate image, and the machine cold-boots instead.
# The Intel iGPU (i915 via the kms hook) still drives the LUKS prompt; nvidia
# loads from the root filesystem afterwards. Undo: delete this file and run
# sudo limine-mkinitcpio. Added 2026-10-23.
_keep=()
for _m in "${MODULES[@]}"; do
  case $_m in nvidia | nvidia_modeset | nvidia_uvm | nvidia_drm) ;; *) _keep+=("$_m") ;; esac
done
MODULES=("${_keep[@]}")
unset _keep _m
