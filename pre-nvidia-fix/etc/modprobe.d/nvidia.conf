options nvidia_drm modeset=1

# Sleep (S3) on this open 610 driver restores the HDMI framebuffer only when
# every video-memory allocation is saved. Setting
# NVreg_PreserveVideoMemoryAllocations=0 resumed with Xid 13 and
# nvidia-drm atomic modeset -11, which left the external Acer garbled
# (2026-10-03 01:34). The same setting let a hibernate image load, then
# Hyprland died on flip timeouts.
#
# NVreg_UseKernelSuspendNotifiers=1 (nvidia-utils) saves that memory during
# suspend. /proc/driver/nvidia/suspend is not created by this open module, so
# the nvidia-suspend units stay disabled.
#
# Hibernate resume still hits nv_pmops_freeze -5 with this parameter set,
# and the machine cold-boots instead of restoring the image. Do not set the
# parameter back to 0 to chase that. It breaks ordinary sleep.
# /etc/modprobe.d/gsr-nvidia.conf masks gpu-screen-recorder's copy of this option.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
