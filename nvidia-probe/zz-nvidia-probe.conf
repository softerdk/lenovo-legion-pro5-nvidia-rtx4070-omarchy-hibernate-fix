# Diagnostic (2026-10-26): nvidia-probe right before encrypt, see
# /etc/initcpio/hooks/nvidia-probe. Undo: remove this file, the
# nvidia-probe install/hooks files, and run limine-mkinitcpio.
_probe_hooks=()
for _probe_hook in "${HOOKS[@]}"; do
  [[ $_probe_hook == encrypt ]] && _probe_hooks+=(nvidia-probe)
  _probe_hooks+=("$_probe_hook")
done
HOOKS=("${_probe_hooks[@]}")
unset _probe_hooks _probe_hook
