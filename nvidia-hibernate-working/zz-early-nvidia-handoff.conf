# Early NVIDIA for the LUKS prompt on the external HDMI screen (2026-10-26).
# nvidia-handoff goes after encrypt and BEFORE resume (variant 2): nvidia must
# be gone before a hibernate image is restored, or the restored driver finds
# a GPU another driver instance set up (Xid 31, black screens, 12:34 test).
# Undo: ~/fumast3r/lenovo-legion-pro5-nvidia-rtx4070-omarchy-hibernate-fix/pre-nvidia-fix/restore.sh
_handoff_hooks=()
for _handoff_hook in "${HOOKS[@]}"; do
  [[ $_handoff_hook == resume ]] && _handoff_hooks+=(nvidia-handoff)
  _handoff_hooks+=("$_handoff_hook")
done
[[ " ${_handoff_hooks[*]} " == *" nvidia-handoff "* ]] || _handoff_hooks+=(nvidia-handoff)
HOOKS=("${_handoff_hooks[@]}")
unset _handoff_hooks _handoff_hook
