# Copied into the initramfs only, as /etc/modprobe.d/zz-nvidia-initrd.conf (2026-10-26).
# On a hibernate resume the boot kernel must freeze nvidia before jumping into
# the image; with PreserveVideoMemoryAllocations=1 that fails (-5, no procfs
# suspend interface) and the machine cold-boots. The boot kernel has no video
# memory worth keeping. No fbdev so nothing but plymouth holds the driver.
options nvidia NVreg_PreserveVideoMemoryAllocations=0
options nvidia_drm fbdev=0
